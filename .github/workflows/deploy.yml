# Deploy the theme to the live site on Hostinger (FTP over TLS, with lftp) whenever main changes.
#
# Needs these repository secrets (GitHub → Settings → Secrets and variables → Actions),
# copied from hPanel → Files → FTP Accounts:
#   HOSTINGER_FTP_SERVER   FTP server IP, e.g. 45.130.228.127 (the domain's DNS is at Porkbun, so ftp.<domain> doesn't exist)
#   HOSTINGER_FTP_USER     FTP username, e.g. u123456789 or u123456789.example.com
#   HOSTINGER_FTP_PASSWORD FTP password
#   HOSTINGER_FTP_DIR      theme folder as the FTP account sees it, ending in /wp-content/themes/tales2tiles/
#                          e.g. /public_html/wp-content/themes/tales2tiles/
# Until they're set, the workflow only runs the syntax checks.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for a manual redeploy.

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Check PHP and JavaScript syntax
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null || exit 1; done
          for f in $(git ls-files 'assets/js/*.js'); do node --check "$f" || exit 1; done

      - name: Deploy secrets not set yet
        if: env.FTP_SERVER == ''
        run: echo "::notice::Hostinger FTP secrets are not set, so nothing was deployed. See the comment at the top of deploy.yml."

      - name: Check the FTP folder
        if: env.FTP_SERVER != ''
        run: |
          # Only ever upload into the theme folder.
          case "$FTP_DIR" in
            */wp-content/themes/tales2tiles/) ;;
            *) echo "::error::HOSTINGER_FTP_DIR must end with /wp-content/themes/tales2tiles/"; exit 1 ;;
          esac

      - name: Upload theme to Hostinger
        if: env.FTP_SERVER != ''
        env:
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }} # read by lftp --env-password, never on the command line
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # FTP over TLS for both the login and the file transfers. Hostinger's server needs the TLS
          # session reused on data connections, which lftp does. Its certificate is for *.hstgr.io,
          # not our server address, so the name check is off (traffic is still encrypted).
          # mirror -R: upload what changed, delete files removed from the repo (theme folder only).
          lftp --env-password -u "$FTP_USER" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5;
            mirror --reverse --delete --verbose=1 --parallel=2 \
              --exclude-glob .git* --exclude-glob .github/ --exclude-glob AGENTS.md --exclude-glob CLAUDE.md \
              --exclude-glob .qa/ --exclude-glob .DS_Store \
              ./ '$FTP_DIR';
            bye"
          echo "Deployed $(git rev-parse --short HEAD) to $FTP_DIR"
